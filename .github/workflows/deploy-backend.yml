# Deploys the journal backend to Cloud Run when backend/ changes on main.
#
# The tests run first; a failing test stops the deploy. GitHub signs in to Google
# Cloud without a stored key (Workload Identity Federation): Google only accepts
# this repository's main branch, and the account it signs in as can do nothing but
# push an image and update this one kind of service. See backend/README.md.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/README.md"
      - ".github/workflows/deploy-backend.yml"

# One deploy at a time, in the order the pushes came.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: day1sec
  REGION: asia-southeast2
  SERVICE: journal-backend
  IMAGE: asia-southeast2-docker.pkg.dev/day1sec/cloud-run-source-deploy/journal-backend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The same Python as backend/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job ask GitHub for the token Google checks.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/192914238172/locations/global/workloadIdentityPools/github/providers/kilasan
          service_account: github-deployer@day1sec.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" backend
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy to Cloud Run
        # Settings on the service (environment variables, its account) stay as they are.
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE:$GITHUB_SHA" \
            --project "$PROJECT" --region "$REGION" --quiet
      - name: Check that it answers
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --max-time 60 "$url/health"
